name: Android Pull Request & Master CI

on:
  pull_request:
    branches:
      - 'dev'
  push:
    branches:
      - 'dev'

jobs:
  apk:
    name: Generate APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: "temurin"
      - name: Build debug APK
        run: bash ./gradlew assembleDebug --stacktrace
      - name: Build release APK
        run: bash ./gradlew assembleRelease
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          artifactName: app-debug.apk
          name: app
          path: app/build/outputs/apk/debug/
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          artifactName: app-release-unsigned.apk
          name: app
          path: app/build/outputs/apk/release/
      - name: Sign Android release
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/release/
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          signedReleaseFile: app/build/outputs/apk/release/PhotonCamera.apk
      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          artifactName: PhotonCameraRelease.apk
          name: app
          path: app/build/outputs/apk/release/PhotonCameraRelease.apk          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          signedReleaseFile: app/build/outputs/apk/release/PhotonCamera.apk
      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          artifactName: PhotonCameraRelease.apk
          name: app
          path: app/build/outputs/apk/release/PhotonCameraRelease.apk
